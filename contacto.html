<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - D&D HUB</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Contacto</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="partidas.html">Partidas</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>
<main>
    <h2>Únete a una aventura</h2>
    <p>Completa el formulario para contactar y unirte a una campaña.</p>
<form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>
    <label for="campania">Campaña de interés:</label>
    <select id="campania" name="campania">
        <option>La Mina Perdida de Phandelver</option>
        <option>Curse of Strahd</option>
        <option>Dragonlance</option>
        <option>Icewind Dale</option>
    </select>
    <label>
        <input type="checkbox" name="acepto" required>Acepto las condiciones de uso
    </label>
<button type="submit">Enviar</button>
</form>
</main>
<footer>
    <p>Jose Alfonso Pereira Sambruno</p>
    <p>Proyecto D&D HUB</p>
</footer>
</body>
</html>
